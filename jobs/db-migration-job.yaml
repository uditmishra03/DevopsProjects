apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    app: db-migration
spec:
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: db-migration
          image: alpine:latest
          command: ["sh", "-c", "echo 'Running database migration...'; sleep 5; echo 'Migration complete.'"]


